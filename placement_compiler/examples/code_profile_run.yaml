workflow: code
candidate_artifact: ../../placement_candidates/code/candidates.json

profile:
  split: validation
  sample_size: 5
  seed: 42
  repeats: 1
  timeout_seconds: 180
  warmup_runs: 0
  dataset_options:
    load_limit: 25

baseline:
  type: all_endpoint
  endpoint_id: gpt-4.1-mini-cloud

quality_constraint:
  metric: mbpp_plus_pass
  max_drop_from_baseline: 0.05

ranking:
  objectives:
    - metric: cloud_api_cost
      direction: minimise
    - metric: mean_latency_seconds
      direction: minimise

output: ../../placement_profiles/code
