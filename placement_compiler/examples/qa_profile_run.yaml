workflow: qa
candidate_artifact: ../../placement_candidates/qa/candidates.json

profile:
  split: validation
  sample_size: 10
  seed: 42
  repeats: 1
  timeout_seconds: 120
  warmup_runs: 0
  dataset_options:
    level: hard
    load_limit: 100

baseline:
  type: all_endpoint
  endpoint_id: gpt-4.1-mini-cloud

quality_constraint:
  metric: exact_match
  max_drop_from_baseline: 0.05

ranking:
  objectives:
    - metric: cloud_api_cost
      direction: minimise
    - metric: mean_latency_seconds
      direction: minimise

output: ../../placement_profiles/qa
